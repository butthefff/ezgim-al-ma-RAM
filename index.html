<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Sanat ve Müzik Flashcards - Pro</title>
    <style>
        :root { --primary: #6366f1; --accent: #f472b6; }
        body { 
            font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; align-items: center; 
            justify-content: center; height: 100vh; background: radial-gradient(circle, #312e81, #0f172a); 
            margin: 0; color: #fff;
        }
        .counter { margin-bottom: 10px; font-weight: bold; color: #a5b4fc; }
        
        /* Kartın kendisi ve geçiş efekti */
        .card-container { perspective: 1000px; width: 420px; height: 280px; cursor: pointer; margin-bottom: 30px; transition: opacity 0.3s ease; }
        .card { width: 100%; height: 100%; transition: transform 0.6s; transform-style: preserve-3d; position: relative; }
        .card.flipped { transform: rotateY(180deg); }
        .front, .back { 
            position: absolute; width: 100%; height: 100%; backface-visibility: hidden; 
            display: flex; flex-direction: column; align-items: center; justify-content: center; 
            padding: 30px; box-sizing: border-box; border-radius: 25px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center;
        }
        .front { background: #fff; color: #312e81; border: 5px solid var(--primary); }
        .back { transform: rotateY(180deg); background: #eef2ff; color: #4338ca; border: 5px solid var(--accent); }
        
        .status-badge { margin-top: 15px; padding: 5px 15px; border-radius: 20px; font-size: 0.8rem; font-weight: bold; display: none; }
        .known { background: #059669; color: white; display: inline-block; }
        .repeat { background: #e11d48; color: white; display: inline-block; }
        .click-hint { font-size: 0.8rem; color: #94a3b8; margin-top: 10px; }

        .controls { display: flex; gap: 15px; align-items: center; }
        button { 
            padding: 12px 25px; cursor: pointer; border: none; border-radius: 30px; 
            background: var(--primary); color: white; font-weight: bold; transition: 0.2s;
        }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }
    </style>
</head>
<body>

<div class="counter" id="counter">Kart 1 / 20</div>

<div class="card-container" id="card-wrapper" onclick="flipCard()">
    <div class="card" id="card">
        <div class="front" id="front">
            <span id="front-text">Soru</span>
            <div class="click-hint">(Cevabı görmek için tıkla)</div>
        </div>
        <div class="back" id="back">
            <span id="back-text">Cevap</span>
            <div id="status-badge" class="status-badge"></div>
        </div>
    </div>
</div>

<div class="controls">
    <button id="prevBtn" onclick="prevCard()">←</button>
    <button onclick="markAsRepeat()" style="background: #e11d48;">Tekrar</button>
    <button onclick="markAsKnown()" style="background: #059669;">Anladım</button>
    <button id="nextBtn" onclick="nextCard()">→</button>
</div>

<script>
    const flashcards = [
        {"front": "Sanatın kazanılması için gereken temel unsurlar nelerdir?", "back": "Emek, gayret, sabır ve uzun süreli bir eğitim gereklidir."},
        {"front": "Bayram Hoca'ya göre öğretmenlik mesleği nasıl tanımlanır?", "back": "Öğretmenlik, uzun sürede elde edilebilecek bir sanattır."},
        {"front": "Metne göre bir sanatçının eğitimindeki en önemli rehber kimdir?", "back": "Bir hoca veya üstat kontrolü şarttır."},
        {"front": "Öğrencilerin 'ney' öğrenme konusundaki yanılgısı nedir?", "back": "Üç gün gibi kısa sürede öğrenebileceklerini sanmalarıdır."},
        {"front": "Müzik eğitiminde enstrümandan önce kontrol edilmesi gereken nedir?", "back": "Bireyin ritim duygusunun kontrol edilmesidir."},
        {"front": "Metinde geçen 'Hüdayi nâbit' kavramı neyi ifade eder?", "back": "Doğuştan gelen, kendiliğinden oluşan yeteneği ifade eder."},
        {"front": "Erken yaşta sanat eğitimine başlamanın avantajı nedir?", "back": "Daha ileri seviyelere ve uzmanlığa ulaşmayı sağlar."},
        {"front": "Mustafa'ya göre enstrüman çalmanın kişiye en büyük katkısı nedir?", "back": "Sabretmeyi öğretmesidir."},
        {"front": "Bir akademisyenin çok yönlü olmasının kanıtı olarak ne gösterilmiştir?", "back": "Atölyesinde yirmi sekizden fazla sanatla uğraşması."},
        {"front": "Sanat eğitimi ve akademik başarı arasındaki ilişki nasıldır?", "back": "Disiplin ve sabır katsa da çok zaman aldığı için denge zordur."},
        {"front": "Mustafa neden tek bir enstrüman (Kanun) üzerine yoğunlaşmıştır?", "back": "Babasının 'bir enstrüman bir ömürdür' tavsiyesi üzerine."},
        {"front": "Metinde ritim duygusunun eksikliğine verilen örnek hangisidir?", "back": "On beş dil bilen bir hocanın basit bir ritmi tutamaması."},
        {"front": "Enstrüman çalışırken gelişim nasıl takip edilmelidir?", "back": "Düzenli kayıtlar alarak ve zaman içindeki farkı dinleyerek."},
        {"front": "Müzik eğitiminde 'usül' ne anlama gelmektedir?", "back": "Müzikteki ritim ve zamanlama yapısını ifade eder."},
        {"front": "Bayram Hoca toplamda kaç enstrümanın öğretimini yapmıştır?", "back": "Otuzdan fazla Türk müziği sazının öğretimini yapmıştır."},
        {"front": "Enstrümanın 'öğretmen' olarak tanımlanmasının sebebi nedir?", "back": "İstenildiği an makam ve sesleri pratik etme imkanı sunması."},
        {"front": "Sanatın toplumsal ve evrensel yönü metinde nasıl ele alınır?", "back": "Ahlak, estetik ve evrensellik çerçevesinde incelenir."},
        {"front": "Mustafa'nın müzik serüveni hangi yaşta ve hangi aletle başlamıştır?", "back": "Beş yaşında tef (ritim) ile başlamıştır."},
        {"front": "Metne göre sanat eğitiminde ailenin rolü nedir?", "back": "Çocuğun ilgisini desteklemeli ama zorlamamalıdır."},
        {"front": "Sanatçı olmak için sadece istemek yeterli midir?", "back": "Hayır, yetenekle beraber uzun süreli disiplinli çalışma gerekir."}
    ];

    let currentIndex = 0;
    let cardStatus = new Array(flashcards.length).fill(null);

    function updateCard() {
        const wrapper = document.getElementById('card-wrapper');
        wrapper.style.opacity = 0; // Efekt için şeffaflaştır

        setTimeout(() => {
            document.getElementById('front-text').innerText = flashcards[currentIndex].front;
            document.getElementById('back-text').innerText = flashcards[currentIndex].back;
            document.getElementById('counter').innerText = `Kart ${currentIndex + 1} / ${flashcards.length}`;
            
            const badge = document.getElementById('status-badge');
            badge.className = 'status-badge';
            if (cardStatus[currentIndex] === 'known') { badge.innerText = "✅ Anlaşıldı"; badge.classList.add('known'); } 
            else if (cardStatus[currentIndex] === 'repeat') { badge.innerText = "🔄 Tekrar Edilecek"; badge.classList.add('repeat'); }

            document.getElementById('card').classList.remove('flipped');
            document.getElementById('prevBtn').disabled = (currentIndex === 0);
            document.getElementById('nextBtn').disabled = (currentIndex === flashcards.length - 1);
            
            wrapper.style.opacity = 1; // Tekrar görünür yap
        }, 300);
    }

    function flipCard() { document.getElementById('card').classList.toggle('flipped'); }
    function nextCard() { if(currentIndex < flashcards.length - 1) { currentIndex++; updateCard(); } }
    function prevCard() { if(currentIndex > 0) { currentIndex--; updateCard(); } }
    
    function markAsKnown() { 
        cardStatus[currentIndex] = 'known';
        updateCard();
        setTimeout(nextCard, 500); // Anladım deyince kısa gecikmeyle sonraki karta geç
    }
    function markAsRepeat() { 
        cardStatus[currentIndex] = 'repeat';
        updateCard();
    }

    updateCard();
</script>
</body>
</html>
